services:
  db:
    image: postgres:16-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: sot
      POSTGRES_USER: sot
      POSTGRES_PASSWORD: sot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sot -d sot"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-db:
    image: postgres:16-alpine
    ports:
      - "54330:5432"
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agent-db-data:/var/lib/postgresql/data

volumes:
  agent-db-data:
