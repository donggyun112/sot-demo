services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sot
      POSTGRES_USER: sot
      POSTGRES_PASSWORD: sot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sot -d sot"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - sot-db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SOT_ENVIRONMENT: ${SOT_ENVIRONMENT:-production}
      # not ${SOT_DATABASE_URL} — .env points at the host dev db, unreachable from this container
      SOT_DATABASE_URL: postgresql://sot:sot@db:5432/sot
      SOT_MODELS: '${SOT_MODELS:-["test"]}'
      SOT_CORS_ORIGINS: '${SOT_CORS_ORIGINS:-["http://localhost:3000"]}'
      SOT_JWT_SECRET: ${SOT_JWT_SECRET:-}
      SOT_GOOGLE_CLIENT_ID: ${SOT_GOOGLE_CLIENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${SOT_GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  sot-db-data:
