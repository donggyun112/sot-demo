              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="oklch(0.985 0 0)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5h13M4.5 13l8.5-8.5 2.5 2.5L7 15.5l-3 .5z"/></svg>
