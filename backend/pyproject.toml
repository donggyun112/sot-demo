[project]
name = "sot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pydantic-ai-slim[ag-ui,anthropic,google,openai,openrouter]==2.38.0",
    "uvicorn>=0.35,<1",
]

[project.scripts]
sot-migrate = "sot.bootstrap.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sot"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=1,<2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "e2e: requires a live model provider"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
